<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>x1yzl — Engineering, Developer & Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Share+Tech+Mono&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --blood: #8B0000;
    --blood-dim: #5a0000;
    --blood-glow: #a01515;
    --ink: #040305;
    --ink-mid: #07050a;
    --ink-light: #0e0b14;
    --parchment: #d6cfc8;
    --parchment-dim: #a09890;
    --ash: #1e1824;
    --bone: #f0ece6;
    --font-display: 'Cinzel Decorative', serif;
    --font-serif: 'Cinzel', serif;
    --font-mono: 'Share Tech Mono', monospace;
    --font-body: 'IM Fell English', serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background-color: var(--ink);
    color: var(--bone);
    font-family: var(--font-body);
    overflow-x: hidden;
    cursor: none;
    /* deep dark grain texture */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.03'/%3E%3C/svg%3E");
  }

  /* ── CUSTOM CURSOR ── */
  #cursor-dot {
    position: fixed; top: 0; left: 0; width: 7px; height: 7px;
    background: #a01515;
    border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 10px rgba(139,0,0,0.8), 0 0 20px rgba(90,0,0,0.5);
    transition: transform 0.05s, background 0.2s;
  }
  #cursor-ring {
    position: fixed; top: 0; left: 0; width: 36px; height: 36px;
    border: 1px solid rgba(139,0,0,0.6);
    border-radius: 50%;
    pointer-events: none; z-index: 9998;
    transform: translate(-50%,-50%);
    transition: transform 0.18s cubic-bezier(.17,.67,.35,1.2), width 0.2s, height 0.2s, border-color 0.2s;
    opacity: 0.7;
  }
  body:has(a:hover) #cursor-ring,
  body:has(button:hover) #cursor-ring {
    width: 56px; height: 56px;
    border-color: rgba(139,0,0,0.9);
    opacity: 1;
  }

  /* ── CANVAS BACKGROUND ── */
  #bg-canvas {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
  }

  /* ── NOISE OVERLAY ── */
  .noise-overlay {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0.07;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 180px 180px;
    animation: noiseShift 0.4s steps(2) infinite;
  }
  @keyframes noiseShift { 0%{background-position:0 0} 50%{background-position:40px 25px} 100%{background-position:0 0} }

  /* ── VIGNETTE ── */
  .vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.92) 100%);
  }

  /* ── MAIN LAYOUT ── */
  #app { position: relative; z-index: 3; }

  /* ── NAVIGATION ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 4rem;
    border-bottom: 1px solid rgba(139,0,0,0.2);
    backdrop-filter: blur(20px);
    background: rgba(4,3,5,0.88);
    transition: background 0.3s;
  }
  .nav-logo {
    font-family: var(--font-display);
    font-size: 1.4rem;
    color: #c8c0b8;
    letter-spacing: 0.1em;
    text-shadow: 0 0 30px rgba(139,0,0,0.6), 0 0 60px rgba(90,0,0,0.4);
    text-decoration: none;
    transition: color 0.3s;
  }
  .nav-logo:hover { color: var(--bone); }
  .nav-links {
    display: flex; gap: 2.5rem; list-style: none;
  }
  .nav-links a {
    font-family: var(--font-serif);
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #7a7470;
    text-decoration: none;
    position: relative;
    transition: color 0.3s;
  }
  .nav-links a::after {
    content: '';
    position: absolute; bottom: -4px; left: 0; right: 0; height: 1px;
    background: var(--blood);
    transform: scaleX(0); transform-origin: right;
    transition: transform 0.3s ease;
  }
  .nav-links a:hover { color: #e0dbd5; }
  .nav-links a:hover::after { transform: scaleX(1); transform-origin: left; }

  /* ── HERO ── */
  #hero {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 8rem 2rem 9rem;
    position: relative;
    overflow: hidden;
  }
  .hero-sigil {
    width: 180px; height: 180px;
    margin-bottom: 2.5rem;
    position: relative;
    animation: sigilSpin 20s linear infinite;
  }
  @keyframes sigilSpin { to { transform: rotate(360deg); } }
  .hero-sigil-inner {
    position: absolute; inset: 12px;
    animation: sigilSpin 10s linear infinite reverse;
  }
  .hero-eyeline {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    color: #6b0000;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.3s forwards;
  }
  .hero-name {
    font-family: var(--font-display);
    font-size: clamp(3.5rem, 9vw, 8rem);
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: 0.04em;
    color: #f5f0ea;
    text-shadow: 0 0 80px rgba(139,0,0,0.35), 0 4px 0 rgba(0,0,0,0.95), 0 0 140px rgba(90,0,0,0.2);
    opacity: 0;
    animation: fadeUp 0.8s 0.5s forwards;
    position: relative;
  }
  .hero-name .glitch-text { display: inline-block; }
  .hero-tagline {
    font-family: var(--font-serif);
    font-size: clamp(0.9rem, 2vw, 1.2rem);
    color: #9a9490;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-top: 1.2rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.7s forwards;
  }
  .hero-divider {
    width: 200px; height: 1px;
    background: linear-gradient(90deg, transparent, #8B0000, transparent);
    margin: 2.5rem auto;
    opacity: 0;
    animation: fadeIn 1s 1s forwards;
  }
  .hero-desc {
    max-width: 520px;
    font-size: 1.1rem;
    line-height: 1.9;
    color: #c8c4be;
    font-style: italic;
    opacity: 0;
    animation: fadeUp 0.8s 1.1s forwards;
  }
  .hero-ctas {
    display: flex; gap: 1.5rem; margin-top: 3rem;
    opacity: 0;
    animation: fadeUp 0.8s 1.3s forwards;
    flex-wrap: wrap; justify-content: center;
  }

  @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  /* ── SCROLL INDICATOR ── */
  .scroll-indicator {
    position: absolute; bottom: 2.5rem; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    opacity: 0;
    animation: fadeIn 1s 2s forwards;
  }
  .scroll-indicator span {
    font-family: var(--font-mono); font-size: 0.6rem;
    letter-spacing: 0.3em; color: #6b0000; text-transform: uppercase;
  }
  .scroll-line {
    width: 1px; height: 50px;
    background: linear-gradient(to bottom, #8B0000, transparent);
    animation: scrollPulse 2s ease-in-out infinite;
  }
  @keyframes scrollPulse { 0%,100%{opacity:0.3;transform:scaleY(1)} 50%{opacity:1;transform:scaleY(1.2)} }

  /* ── BUTTONS ── */
  .btn-primary {
    font-family: var(--font-serif);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #f0ece6;
    background: #6b0000;
    border: none;
    padding: 1rem 2.5rem;
    cursor: none;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    display: inline-block;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .btn-primary::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }
  .btn-primary:hover { background: #8B0000; box-shadow: 0 0 40px rgba(139,0,0,0.5), 0 0 80px rgba(90,0,0,0.3); }
  .btn-primary:hover::before { transform: translateX(100%); }

  .btn-ghost {
    font-family: var(--font-serif);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #9B1B1B;
    background: transparent;
    border: 1px solid #5a0000;
    padding: 1rem 2.5rem;
    cursor: none;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    display: inline-block;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    transition: color 0.3s, box-shadow 0.3s, border-color 0.3s;
  }
  .btn-ghost::before {
    content: '';
    position: absolute; inset: 0;
    background: #6b0000;
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.3s ease;
    z-index: -1;
  }
  .btn-ghost:hover { color: #f0ece6; border-color: #8B0000; box-shadow: 0 0 40px rgba(139,0,0,0.3); }
  .btn-ghost:hover::before { transform: scaleX(1); }

  /* ── SECTION BASE ── */
  section { position: relative; padding: 8rem 2rem; }
  .section-inner { max-width: 1200px; margin: 0 auto; }

  .section-label {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.4em;
    color: #7a0000;
    text-transform: uppercase;
    margin-bottom: 1rem;
    display: flex; align-items: center; gap: 1rem;
  }
  .section-label::after {
    content: '';
    flex: 1; max-width: 80px; height: 1px;
    background: var(--blood);
  }
  .section-title {
    font-family: var(--font-display);
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
    color: #f2ede8;
    line-height: 1.1;
    text-shadow: 0 0 60px rgba(139,0,0,0.2), 0 2px 0 rgba(0,0,0,0.9);
    margin-bottom: 1.5rem;
  }
  .section-sep {
    width: 60px; height: 2px;
    background: #8B0000;
    margin-bottom: 3rem;
  }

  /* ── ABOUT ── */
  #about {
    background: var(--ink-mid);
    border-top: 1px solid rgba(139,0,0,0.12);
  }
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 5rem;
    align-items: center;
  }
  .about-portrait {
    position: relative;
  }
  .about-portrait-frame {
    width: 100%;
    aspect-ratio: 3/4;
    max-width: 340px;
    background: var(--ink-light);
    border: 1px solid rgba(139,0,0,0.3);
    position: relative;
    overflow: hidden;
  }
  .about-portrait-frame::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      45deg,
      rgba(139,0,0,0.03) 0px, rgba(139,0,0,0.03) 1px,
      transparent 1px, transparent 12px
    );
  }
  .portrait-placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 1rem;
    font-family: var(--font-mono); font-size: 0.65rem;
    letter-spacing: 0.15em; color: var(--blood-dim);
    text-align: center; padding: 2rem;
  }
  .portrait-placeholder svg { opacity: 0.3; }
  .about-portrait-decor {
    position: absolute;
    border: 1px solid rgba(139,0,0,0.2);
    top: -12px; left: -12px; right: 12px; bottom: 12px;
    pointer-events: none;
  }
  .about-portrait-decor2 {
    position: absolute;
    border: 1px solid rgba(139,0,0,0.1);
    top: 12px; left: 12px; right: -12px; bottom: -12px;
    pointer-events: none;
  }
  .about-text p {
    font-size: 1.1rem;
    line-height: 2.1;
    color: #c0bbb5;
    margin-bottom: 1.5rem;
  }
  .about-text p strong { color: #f0ece6; font-style: normal; font-weight: 700; }
  .about-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem; margin-top: 3rem;
  }
  .stat-card {
    border: 1px solid rgba(139,0,0,0.2);
    padding: 1.5rem 1rem;
    text-align: center;
    background: rgba(139,0,0,0.04);
    transition: border-color 0.3s, background 0.3s;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(139,0,0,0.08), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .stat-card:hover { border-color: rgba(139,0,0,0.55); background: rgba(139,0,0,0.08); }
  .stat-card:hover::before { opacity: 1; }
  .stat-number {
    font-family: var(--font-display);
    font-size: 2.2rem;
    color: #9B1B1B;
    text-shadow: 0 0 30px rgba(139,0,0,0.5);
    display: block;
  }
  .stat-label {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    color: #8a8480;
    text-transform: uppercase;
    margin-top: 0.3rem;
    display: block;
  }

  /* ── SKILLS ── */
  #skills { background: var(--ink); }
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2rem;
  }
  .skill-category {
    border: 1px solid rgba(139,0,0,0.18);
    padding: 2rem;
    background: rgba(139,0,0,0.02);
    position: relative;
    overflow: hidden;
    transition: border-color 0.4s, transform 0.3s;
  }
  .skill-category::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--blood), transparent);
    transform: scaleX(0);
    transition: transform 0.4s ease;
  }
  .skill-category:hover { border-color: rgba(139,0,0,0.4); transform: translateY(-4px); }
  .skill-category:hover::before { transform: scaleX(1); }
  .skill-cat-title {
    font-family: var(--font-serif);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #9B1B1B;
    margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 0.8rem;
  }
  .skill-cat-title span { font-size: 1rem; }
  .skill-list { list-style: none; display: flex; flex-direction: column; gap: 0.8rem; }
  .skill-item {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    color: #d0cac4;
  }
  .skill-bar-track {
    width: 100px; height: 3px;
    background: rgba(255,255,255,0.06);
    position: relative;
    overflow: hidden;
  }
  .skill-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #5a0000, #9B1B1B);
    transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 10px rgba(139,0,0,0.6);
  }

  /* ── PROJECTS ── */
  #projects { background: var(--ink-mid); }
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 2rem;
  }
  .project-card {
    border: 1px solid rgba(139,0,0,0.15);
    background: rgba(8,6,8,0.6);
    position: relative;
    overflow: hidden;
    transition: border-color 0.4s, transform 0.4s;
    cursor: none;
  }
  .project-card::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(139,0,0,0.06), transparent 60%);
    opacity: 0;
    transition: opacity 0.4s;
  }
  .project-card:hover { border-color: rgba(139,0,0,0.5); transform: translateY(-6px); }
  .project-card:hover::after { opacity: 1; }
  .project-thumb {
    height: 200px;
    background: var(--ink-light);
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid rgba(139,0,0,0.1);
  }
  .project-thumb-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(139,0,0,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,0,0,0.06) 1px, transparent 1px);
    background-size: 30px 30px;
    animation: gridScroll 8s linear infinite;
  }
  @keyframes gridScroll { to { background-position: 30px 30px; } }
  .project-thumb-label {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem;
    font-family: var(--font-mono); font-size: 0.65rem;
    letter-spacing: 0.15em; color: var(--blood);
    text-align: center; padding: 1.5rem;
  }
  .project-thumb-label .project-icon {
    font-size: 2.5rem; opacity: 0.4;
    display: block; margin-bottom: 0.5rem;
  }
  .project-body { padding: 2rem; }
  .project-tag-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .project-tag {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #6b0000;
    border: 1px solid rgba(139,0,0,0.25);
    padding: 0.25rem 0.6rem;
  }
  .project-name {
    font-family: var(--font-serif);
    font-size: 1.3rem;
    font-weight: 700;
    color: #f0ece6;
    margin-bottom: 0.8rem;
    letter-spacing: 0.04em;
  }
  .project-desc {
    font-size: 0.95rem;
    line-height: 1.9;
    color: #b8b4ae;
    margin-bottom: 1.5rem;
  }
  .project-links { display: flex; gap: 1rem; }
  .project-link {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: #9B1B1B;
    text-decoration: none;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 0.4rem;
    transition: color 0.3s;
    border-bottom: 1px solid rgba(139,0,0,0.35);
    padding-bottom: 2px;
  }
  .project-link:hover { color: #c42020; border-color: #c42020; }

  /* ── SERVICES ── */
  #services { background: var(--ink); }
  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.5rem;
  }
  .service-card {
    padding: 2.5rem 2rem;
    border: 1px solid rgba(139,0,0,0.12);
    background: rgba(139,0,0,0.02);
    position: relative;
    overflow: hidden;
    transition: all 0.4s;
  }
  .service-card::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 0;
    background: rgba(139,0,0,0.06);
    transition: height 0.4s ease;
  }
  .service-card:hover { border-color: rgba(139,0,0,0.4); transform: translateY(-4px); }
  .service-card:hover::before { height: 100%; }
  .service-num {
    font-family: var(--font-display);
    font-size: 3rem;
    color: rgba(139,0,0,0.15);
    line-height: 1;
    margin-bottom: 1.5rem;
    transition: color 0.4s;
  }
  .service-card:hover .service-num { color: rgba(139,0,0,0.3); }
  .service-name {
    font-family: var(--font-serif);
    font-size: 1rem;
    font-weight: 700;
    color: #f0ece6;
    letter-spacing: 0.06em;
    margin-bottom: 0.8rem;
  }
  .service-desc {
    font-size: 0.88rem;
    line-height: 1.9;
    color: #b0aba5;
  }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);

// ── CANVAS PARTICLES ──
function initCanvas(color) {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [], animId;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function hex2rgb(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return {r,g,b};
  }

  function makeParticle(count) {
    particles = [];
    const c = hex2rgb(color);
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random()-0.5)*0.3,
        vy: (Math.random()-0.5)*0.3,
        r: Math.random()*1.5+0.3,
        alpha: Math.random()*0.4+0.05,
        pulse: Math.random()*Math.PI*2,
        c
      });
    }
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    const t = Date.now()*0.001;
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      p.pulse += 0.015;
      if (p.x<0) p.x=W; if (p.x>W) p.x=0;
      if (p.y<0) p.y=H; if (p.y>H) p.y=0;
      const alpha = p.alpha*(0.7+0.3*Math.sin(p.pulse));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${p.c.r},${p.c.g},${p.c.b},${alpha})`;
      ctx.fill();
    });
    // draw faint connections
    for (let i=0;i<particles.length;i++) {
      for (let j=i+1;j<particles.length;j++) {
        const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if (dist<120) {
          const {c}=particles[i];
          ctx.beginPath();
          ctx.moveTo(particles[i].x,particles[i].y);
          ctx.lineTo(particles[j].x,particles[j].y);
          ctx.strokeStyle=`rgba(${c.r},${c.g},${c.b},${(1-dist/120)*0.08})`;
          ctx.lineWidth=0.5;
          ctx.stroke();
        }
      }
    }
    animId = requestAnimationFrame(draw);
  }

  return { init: makeParticle, start: draw, stop: ()=>cancelAnimationFrame(animId) };
}

// ── CURSOR TRAIL ──
function initCursor(enabled) {
  const dot = document.getElementById('cursor-dot');
  const ring = document.getElementById('cursor-ring');
  let mx=0,my=0,rx=0,ry=0;
  let trailDots = [];
  const TRAIL_LEN = 12;

  if (enabled) {
    for (let i=0;i<TRAIL_LEN;i++) {
      const d = document.createElement('div');
      d.style.cssText=`position:fixed;top:0;left:0;width:${4-i*0.2}px;height:${4-i*0.2}px;background:var(--blood);border-radius:50%;pointer-events:none;z-index:9997;transform:translate(-50%,-50%);opacity:${(1-i/TRAIL_LEN)*0.4};transition:none;`;
      document.body.appendChild(d);
      trailDots.push({el:d,x:0,y:0});
    }
  }

  window.addEventListener('mousemove', e=>{
    mx=e.clientX; my=e.clientY;
    dot.style.left=mx+'px'; dot.style.top=my+'px';
    if (enabled && trailDots.length) trailDots[0]={el:trailDots[0].el,x:mx,y:my};
  });

  if (enabled) {
    let prev=[{x:0,y:0}];
    function updateTrail() {
      for (let i=trailDots.length-1;i>0;i--) {
        trailDots[i].x+=(trailDots[i-1].x-trailDots[i].x)*0.3;
        trailDots[i].y+=(trailDots[i-1].y-trailDots[i].y)*0.3;
        trailDots[i].el.style.left=trailDots[i].x+'px';
        trailDots[i].el.style.top=trailDots[i].y+'px';
      }
      if(trailDots[0]) { trailDots[0].el.style.left=trailDots[0].x+'px'; trailDots[0].el.style.top=trailDots[0].y+'px'; }
      requestAnimationFrame(updateTrail);
    }
    updateTrail();
  }

  function animate() {
    rx+=(mx-rx)*0.12; ry+=(my-ry)*0.12;
    ring.style.left=rx+'px'; ring.style.top=ry+'px';
    requestAnimationFrame(animate);
  }
  animate();
}

}

function Runes({enabled}) {
  if (!enabled) return null;

  return (

function SkillBar({name, pct}) {

      if(e.isIntersecting){setFilled(pct); io.disconnect();}
    },{threshold:0.3});
    if(ref.current) io.observe(ref.current);
    return ()=>io.disconnect();
  },[pct]);
  return (
    <li className="skill-item" ref={ref}>
      <span>{name}</span>
      <div className="skill-bar-track">
        <div className="skill-bar-fill" style={{width:`${filled}%`}}></div>

    </li>
  );
}

function waitForTweaks(cb, attempts = 0) {

  if (attempts > 50) { console.error('tweaks-panel never loaded'); cb(); return; }
  setTimeout(() => waitForTweaks(cb, attempts + 1), 50);
}
