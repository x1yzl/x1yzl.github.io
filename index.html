<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>x1yzl — Full Stack Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#030305;--bg2:#060609;--bg3:#0a0a0e;
  --glass:rgba(8,8,12,0.75);--glass-border:rgba(180,180,180,0.05);
  --primary:#b0b0b4;--primary-dim:#5a5a5e;--primary-glow:rgba(192,192,192,0.15);
  --primary-subtle:rgba(192,192,192,0.035);
  --accent:#c4c4c8;--accent-dim:#444;
  --text:#d0d0d4;--text-dim:#686870;--text-muted:#303038;
  --font-body:'Space Grotesk',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --ink-light:rgba(6,6,10,0.65);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);overflow-x:hidden;line-height:1.6;cursor:default}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--primary-dim);border-radius:2px}

/* ── Grain Overlay ── */
#grain{position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0.03;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-repeat:repeat;background-size:200px 200px}

/* ── Cursor Spotlight ── */
#cursor-spot{position:fixed;inset:0;z-index:9998;pointer-events:none;background:radial-gradient(500px circle at var(--mx,50%) var(--my,50%),rgba(192,192,192,0.07),rgba(192,192,192,0.02) 40%,transparent 65%)}

/* ── Canvas ── */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── Glass Base ── */
.glass{background:rgba(6,6,10,0.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:16px}
.glass-lg{border-radius:24px}

/* ── Animations ── */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes float-slow{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 20px var(--primary-glow)}50%{box-shadow:0 0 40px var(--primary-glow),0 0 60px var(--primary-glow)}}
@keyframes spin-slow{to{transform:rotate(360deg)}}
@keyframes spin-reverse{to{transform:rotate(-360deg)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes noise-shift{0%{transform:translate(0,0)}33%{transform:translate(-1%,1%)}66%{transform:translate(1%,-1%)}100%{transform:translate(0,0)}}
@keyframes orbit-1{from{transform:rotate(0deg) translateX(130px) rotate(0deg)}to{transform:rotate(360deg) translateX(130px) rotate(-360deg)}}
@keyframes orbit-2{from{transform:rotate(60deg) translateX(130px) rotate(-60deg)}to{transform:rotate(420deg) translateX(130px) rotate(-420deg)}}
@keyframes orbit-3{from{transform:rotate(120deg) translateX(130px) rotate(-120deg)}to{transform:rotate(480deg) translateX(130px) rotate(-480deg)}}
@keyframes orbit-4{from{transform:rotate(180deg) translateX(130px) rotate(-180deg)}to{transform:rotate(540deg) translateX(130px) rotate(-540deg)}}
@keyframes orbit-5{from{transform:rotate(240deg) translateX(130px) rotate(-240deg)}to{transform:rotate(600deg) translateX(130px) rotate(-600deg)}}
@keyframes orbit-6{from{transform:rotate(300deg) translateX(130px) rotate(-300deg)}to{transform:rotate(660deg) translateX(130px) rotate(-660deg)}}


/* ── Scroll Reveal ── */
.reveal{opacity:0;transform:translateY(30px);transition:all 0.7s cubic-bezier(0.22,1,0.36,1)}
.reveal.in-view{opacity:1;transform:translateY(0)}
.reveal-scale{opacity:0;transform:scale(0.92);transition:all 0.7s cubic-bezier(0.22,1,0.36,1)}
.reveal-scale.in-view{opacity:1;transform:scale(1)}

/* ── Section ── */
.section-wrap{max-width:1200px;margin:0 auto;padding:100px 32px;position:relative;z-index:1}
.section-label{font-family:var(--font-mono);font-size:0.7rem;color:var(--primary);letter-spacing:0.25em;text-transform:uppercase;margin-bottom:8px}
.section-title{font-size:clamp(2rem,4.5vw,3.2rem);font-weight:700;line-height:1.1;margin-bottom:48px}

/* ── Bento Grid ── */
.bento-grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.bento-cell{background:rgba(6,6,10,0.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:18px;padding:28px;transition:all 0.4s cubic-bezier(0.22,1,0.36,1);position:relative;overflow:hidden}
.bento-cell:hover{border-color:rgba(192,192,192,0.3);box-shadow:0 0 30px var(--primary-glow);transform:translateY(-2px)}
.bento-cell::before{content:'';position:absolute;inset:0;border-radius:18px;background:radial-gradient(600px circle at var(--mx,50%) var(--my,50%),var(--primary-subtle),transparent 60%);opacity:0;transition:opacity 0.4s;pointer-events:none}
.bento-cell:hover::before{opacity:1}

/* ── Buttons ── */
.btn-primary,.btn-ghost{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:100px;font-family:var(--font-body);font-size:0.9rem;font-weight:600;cursor:pointer;text-decoration:none;transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);position:relative;overflow:hidden}
.btn-primary{background:var(--primary);border:none;color:#0a0a0c;box-shadow:0 0 20px var(--primary-glow)}
.btn-primary:hover{box-shadow:0 0 40px var(--primary-glow);transform:translateY(-2px) scale(1.02)}
.btn-ghost{background:transparent;border:1px solid var(--glass-border);color:var(--text)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary);box-shadow:0 0 20px var(--primary-glow);transform:translateY(-2px)}
.magnetic-wrap{display:inline-flex}

/* ── Dock Nav ── */
.dock-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:1000}
.dock{display:flex;align-items:center;gap:3px;background:rgba(6,6,10,0.85);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--glass-border);border-radius:18px;padding:5px 7px;box-shadow:0 4px 40px rgba(0,0,0,0.6),0 0 20px var(--primary-glow)}
.dock-btn{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);position:relative;font-size:1rem}
.dock-btn:hover,.dock-btn.active{background:var(--primary-subtle);color:var(--primary);transform:translateY(-4px)}
.dock-btn.active{color:var(--primary)}
.dock-btn .tooltip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--glass-border);border-radius:6px;padding:4px 10px;font-size:0.65rem;font-family:var(--font-mono);color:var(--text-dim);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.2s}
.dock-btn:hover .tooltip{opacity:1}
.dock-sep{width:1px;height:22px;background:var(--glass-border);margin:0 3px}

/* ── Splash Hero ── */
.splash-orb{position:absolute;border-radius:50%;pointer-events:none;transition:transform 0.2s ease-out}

/* ── Orbital Avatar ── */
.orbit-ring{position:absolute;border-radius:50%}
.orbit-badge{position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(6,6,10,0.85);border:1px solid var(--glass-border);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);box-shadow:0 0 12px var(--primary-glow);transition:all 0.3s ease}
.orbit-badge:hover{transform:translate(-50%,-50%) scale(1.3) !important;border-color:var(--primary);box-shadow:0 0 24px var(--primary-glow)}

/* ── Skills ── */
.skill-card{position:relative;background:rgba(6,6,10,0.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:14px;padding:18px 14px;transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);cursor:default;overflow:hidden}
.skill-card:hover{background:rgba(20,20,28,0.8);border-color:var(--primary);box-shadow:0 0 20px var(--primary-glow);transform:translateY(-4px) scale(1.02)}
.skill-bar{height:3px;background:var(--bg3);border-radius:4px;overflow:hidden}
.skill-bar-fill{height:100%;border-radius:4px;background:linear-gradient(to right,var(--primary-dim),var(--primary));transition:width 1s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 0 6px var(--primary-glow)}

/* ── Project Cards ── */
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px}
.project-card{position:relative;border:1px solid var(--glass-border);background:rgba(6,6,10,0.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:20px;overflow:hidden;transition:border-color 0.4s,box-shadow 0.4s,transform 0.4s cubic-bezier(0.23,1,0.32,1);transform-style:preserve-3d;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--hover-y,0px)) translateZ(var(--rz,0px));will-change:transform}
.project-card.featured{border-color:rgba(192,192,192,0.25)}
.project-card:hover{border-color:rgba(192,192,192,0.4);box-shadow:0 20px 60px rgba(0,0,0,0.3),0 0 40px var(--primary-glow);--hover-y:-4px}
.project-card.featured:hover{border-color:rgba(192,192,192,0.5);box-shadow:0 0 45px var(--primary-glow),0 20px 60px rgba(0,0,0,0.2)}
.project-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(192,192,192,0.04),transparent 60%);opacity:0;transition:opacity 0.4s;pointer-events:none}
.project-card:hover::after{opacity:1}
.project-thumb{height:200px;background:var(--ink-light);position:relative;overflow:hidden;border-bottom:1px solid var(--glass-border);isolation:isolate}
.project-thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(7,7,10,0.7) 100%);pointer-events:none;z-index:1}
.project-thumb-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(192,192,192,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(192,192,192,0.04) 1px,transparent 1px);background-size:30px 30px;animation:gridScroll 10s linear infinite;transition:opacity 0.4s}
.project-card:hover .project-thumb-grid{animation-duration:3s;opacity:0.5}
@keyframes gridScroll{to{background-position:30px 30px}}
.project-thumb-img{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none}
.project-thumb-img svg{width:54px;height:54px;opacity:0.2;transition:opacity 0.5s,transform 0.5s cubic-bezier(0.23,1,0.32,1)}
.project-card:hover .project-thumb-img svg{opacity:0.5;transform:scale(1.15)}
.project-thumb-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.4rem;font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.15em;color:var(--primary);text-align:center;padding:1.5rem;z-index:2}
.project-thumb-label .project-icon{font-size:2.5rem;opacity:0.3;display:block;margin-bottom:0.4rem;transition:all 0.5s;filter:drop-shadow(0 0 10px rgba(192,192,192,0.15))}
.project-card:hover .project-icon{opacity:0.7;transform:scale(1.2) rotate(5deg);filter:drop-shadow(0 0 20px rgba(192,192,192,0.3))}
.project-thumb-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:2}
.project-thumb-dots span{width:4px;height:4px;border-radius:50%;background:rgba(192,192,192,0.25);transition:all 0.3s}
.project-card:hover .project-thumb-dots span{background:rgba(192,192,192,0.6)}
.project-thumb-dots span:nth-child(2){width:10px;border-radius:2px}
.project-body{padding:1.5rem 1.8rem 1.8rem;position:relative;z-index:1}
.project-badge{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px}
.project-badge-dot{width:5px;height:5px;border-radius:50%;display:inline-block;animation:badgePulse 1.8s ease-in-out infinite}
.project-badge-dot.live{background:#4ade80!important;animation-name:badgePulseLive}
@keyframes badgePulse{0%,100%{opacity:0.4;box-shadow:0 0 0 rgba(192,192,192,0)}50%{opacity:1;box-shadow:0 0 6px rgba(192,192,192,0.6)}}
@keyframes badgePulseLive{0%,100%{opacity:0.5;box-shadow:0 0 0 rgba(74,222,128,0)}50%{opacity:1;box-shadow:0 0 8px rgba(74,222,128,0.5)}}
.project-tag-row{display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.7rem}
.project-tag{background:var(--primary-subtle);border:1px solid rgba(192,192,192,0.15);border-radius:6px;padding:3px 10px;font-size:0.68rem;font-family:var(--font-mono);color:var(--text-dim);transition:all 0.2s}
.project-card:hover .project-tag{border-color:rgba(192,192,192,0.3)}
.project-name{font-size:1.2rem;font-weight:700;margin-bottom:6px;transition:color 0.4s}
.project-card:hover .project-name{color:var(--primary)}
.project-desc{font-size:0.85rem;color:var(--text-dim);line-height:1.7;margin-bottom:14px;transition:color 0.4s}
.project-card:hover .project-desc{color:var(--text)}
.project-links{display:flex;gap:12px;flex-wrap:wrap}
.project-link{font-family:var(--font-mono);font-size:0.72rem;color:var(--text-muted);text-decoration:none;transition:all 0.3s;padding:4px 0;border-bottom:1px solid transparent}
.project-link:hover{color:var(--primary);border-bottom-color:var(--primary)}

/* ── Ripple ── */
.ripple-container{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit;z-index:10;isolation:isolate}
.ripple{position:absolute;border-radius:50%;background:rgba(192,192,192,0.3);transform:scale(0);animation:rippleAnim 0.8s ease-out forwards;pointer-events:none}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}

/* ── Services ── */
.services-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.service-card{background:rgba(6,6,10,0.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:16px;padding:24px;transition:all 0.4s cubic-bezier(0.22,1,0.36,1);position:relative;overflow:hidden}
.service-card:hover{border-color:rgba(192,192,192,0.3);box-shadow:0 0 30px var(--primary-glow);transform:translateY(-4px)}
.service-num{font-family:var(--font-mono);font-size:0.65rem;color:var(--text-muted);margin-bottom:8px}
.service-name{font-weight:600;font-size:1rem;margin-bottom:6px}
.service-desc{font-size:0.82rem;color:var(--text-dim);line-height:1.6}
.service-card-corner{position:absolute;width:20px;height:20px;border-color:var(--primary);opacity:0;transition:opacity 0.4s}
.service-card:hover .service-card-corner{opacity:0.4}
.service-card-corner.tl{top:8px;left:8px;border-top:1px solid;border-left:1px solid}
.service-card-corner.br{bottom:8px;right:8px;border-bottom:1px solid;border-right:1px solid}

/* ── Contact ── */
.contact-card{max-width:620px;margin:0 auto;padding:48px 48px 40px;text-align:center}
.contact-subtitle{color:var(--text-dim);font-size:0.95rem;line-height:1.8;max-width:440px;margin:0 auto 36px}
.contact-grid{display:flex;flex-direction:column;gap:12px;max-width:360px;margin:0 auto}
.contact-item{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:14px;background:rgba(192,192,192,0.045);border:1px solid var(--glass-border);font-size:0.85rem;color:var(--text);text-decoration:none;transition:all 0.3s cubic-bezier(0.22,1,0.36,1);position:relative;overflow:hidden}
.contact-item:hover{border-color:rgba(192,192,192,0.25);background:rgba(192,192,192,0.08);transform:translateX(4px);box-shadow:0 0 20px var(--primary-glow)}
.contact-item-icon{width:20px;height:20px;flex-shrink:0;color:var(--primary)}
.contact-item-label{flex:1;text-align:left;font-weight:500}
.contact-item-arrow{font-size:0.7rem;color:var(--primary);font-family:var(--font-mono);transition:transform 0.3s}
.contact-item:hover .contact-item-arrow{transform:translate(2px,-2px)}

/* ── Experience ── */
.exp-card{padding:32px 36px;position:relative;overflow:hidden}
.exp-card .corner-glow{position:absolute;top:0;right:0;width:200px;height:200px;background:radial-gradient(circle at top right,var(--primary-subtle),transparent 70%);pointer-events:none}

/* ── Katana ── */
.katana-wrap{position:fixed;bottom:-10px;right:5%;z-index:50;cursor:default;filter:drop-shadow(0 0 20px var(--primary-glow))}
.katana-svg{width:240px;height:auto;overflow:visible;transform-origin:bottom center;will-change:transform}
@keyframes kgGlow{0%,100%{opacity:0.035}50%{opacity:0.15}}
@keyframes kgPulse{0%,100%{opacity:0.1;r:0.4}50%{opacity:0.5;r:0.8}}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--sx,30px),var(--sy,-40px)) scale(0)}}
@keyframes sheathe{0%{transform:translateY(0) rotate(var(--kr,0deg));opacity:1}30%{transform:translateY(-10px) rotate(5deg);opacity:1}100%{transform:translateY(120px) rotate(15deg);opacity:0}}

/* ── Footer ── */
footer{padding:40px 32px 80px;text-align:center;border-top:1px solid var(--glass-border)}
.footer-copy{font-size:0.8rem;color:var(--text-muted);margin-bottom:4px}
.footer-tagline{font-size:0.7rem;color:var(--text-muted);font-family:var(--font-mono)}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:var(--bg2);border:1px solid var(--glass-border);border-radius:20px;padding:32px;max-width:400px;width:90%;text-align:center}
.modal-title{font-size:1.2rem;font-weight:700;margin-bottom:12px}
.modal-text{color:var(--text-dim);font-size:0.9rem;margin-bottom:24px;line-height:1.6}
.modal-actions{display:flex;gap:12px;justify-content:center}

/* ── Tweaks Panel ── */
.tweaks-toggle{position:fixed;top:16px;right:16px;z-index:998;width:36px;height:36px;border-radius:10px;border:1px solid var(--glass-border);background:rgba(6,6,10,0.85);backdrop-filter:blur(12px);color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;transition:all 0.3s;font-family:var(--font-mono)}
.tweaks-toggle:hover{border-color:rgba(192,192,192,0.2);color:var(--primary);box-shadow:0 0 20px var(--primary-glow)}
.tweaks-panel{position:fixed;top:60px;right:16px;z-index:998;background:rgba(6,6,10,0.92);border:1px solid var(--glass-border);border-radius:16px;padding:24px;min-width:220px;box-shadow:0 20px 60px rgba(0,0,0,0.7);animation:panelIn 0.3s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(-10px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.tweak-section{margin-bottom:16px}
.tweak-section:last-child{margin-bottom:0}
.tweak-section-title{font-family:var(--font-mono);font-size:0.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px}
.tweak-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.tweak-label{font-size:0.8rem;color:var(--text-dim)}
.tweak-input{background:var(--bg3);border:1px solid var(--glass-border);border-radius:6px;padding:4px 8px;color:var(--text);font-family:var(--font-mono);font-size:0.75rem;width:70px;text-align:center}
.tweak-input:focus{outline:none;border-color:var(--primary)}
.tweak-toggle-btn{width:32px;height:20px;border-radius:10px;border:none;cursor:pointer;transition:all 0.3s;position:relative}
.tweak-toggle-btn.on{background:var(--primary)}
.tweak-toggle-btn.off{background:var(--bg3)}
.tweak-toggle-btn::after{content:'';position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:all 0.3s}
.tweak-toggle-btn.on::after{left:14px}
.tweak-toggle-btn.off::after{left:2px}
.color-picker{width:30px;height:30px;border-radius:6px;border:1px solid var(--glass-border);padding:0;cursor:pointer;background:none}
.color-picker::-webkit-color-swatch-wrapper{padding:2px}

<script>
// ── CANVAS — Stars ──
(function(){
  const c=document.getElementById('bg-canvas'),ctx=c.getContext('2d');
  let W,H,stars=[],drifting=[],shooting=[],animId,lastFrame=0,t=0;
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
  function initStars(n){
    stars=[];drifting=[];shooting=[];t=0;
    for(let i=0;i<n;i++){
      const big=Math.random();
      stars.push({
        x:Math.random()*W,y:Math.random()*H,
        vx:(Math.random()-0.5)*0.015,vy:(Math.random()-0.5)*0.015,
        r:big<0.08?Math.random()*2+1.8:big<0.25?Math.random()*1+0.8:Math.random()*0.5+0.3,
        baseAlpha:Math.random()*0.35+0.1,
        phase:Math.random()*Math.PI*2,
        speed:Math.random()*0.02+0.005,
        hasGlow:big<0.15,
      });
    }
    for(let i=0;i<30;i++)drifting.push({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-0.5)*0.008,vy:(Math.random()-0.5)*0.008,
      r:Math.random()*0.3+0.08,
      alpha:Math.random()*0.08+0.02,
      phase:Math.random()*Math.PI*2,
      speed:Math.random()*0.01+0.003,
    });
    for(let i=0;i<2;i++)shooting.push({
      x:Math.random()*W,y:Math.random()*H*0.3,
      len:60+Math.random()*80,sp:2+Math.random()*3,
      a:0,life:0,
    });
  }
  function draw(now){
    if(now-lastFrame<33){animId=requestAnimationFrame(draw);return}
    lastFrame=now;t++;
    ctx.clearRect(0,0,W,H);

    // ── Drifting micro-dust ──
    for(let i=0;i<drifting.length;i++){
      const p=drifting[i];
      p.x+=p.vx;p.y+=p.vy;p.phase+=p.speed;
      if(p.x<-10)p.x=W+10;else if(p.x>W+10)p.x=-10;
      if(p.y<-10)p.y=H+10;else if(p.y>H+10)p.y=-10;
      const a=p.alpha*(0.6+0.4*Math.sin(p.phase));
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.fill();
    }

    // ── Stars ──
    for(let i=0;i<stars.length;i++){
      const s=stars[i];
      s.x+=s.vx;s.y+=s.vy;s.phase+=s.speed;
      if(s.x<-20)s.x=W+20;else if(s.x>W+20)s.x=-20;
      if(s.y<-20)s.y=H+20;else if(s.y>H+20)s.y=-20;

      const pulse=0.3+0.7*(0.5+0.5*Math.sin(s.phase));
      const alpha=s.baseAlpha*pulse;

      // Glow halo for bigger stars
      if(s.hasGlow&&s.r>1.2){
        const grd=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*5);
        grd.addColorStop(0,'rgba(255,255,255,'+(alpha*0.12)+')');
        grd.addColorStop(1,'rgba(255,255,255,0)');
        ctx.beginPath();ctx.arc(s.x,s.y,s.r*5,0,Math.PI*2);
        ctx.fillStyle=grd;ctx.fill();
      }

      // Star body
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+alpha+')';ctx.fill();

      // Bright core for medium+ stars
      if(s.r>0.8){
        ctx.beginPath();ctx.arc(s.x,s.y,s.r*0.4,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,'+(alpha*0.5)+')';ctx.fill();
      }
    }

    // ── Connection lines (sparse) ──
    for(let i=0;i<stars.length;i+=4){
      for(let j=i+1;j<stars.length;j+=4){
        const dx=stars[i].x-stars[j].x,dy=stars[i].y-stars[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<90){
          ctx.beginPath();ctx.moveTo(stars[i].x,stars[i].y);
          ctx.lineTo(stars[j].x,stars[j].y);
          ctx.strokeStyle='rgba(255,255,255,'+(0.015*(1-dist/90))+')';
          ctx.lineWidth=0.15;ctx.stroke();
        }
      }
    }

    // ── Shooting stars ──
    for(let i=0;i<shooting.length;i++){
      const m=shooting[i];
      if(m.life<=0){
        m.x=Math.random()*W;m.y=Math.random()*H*0.35;
        m.life=60+Math.random()*100;m.a=0.8+Math.random()*0.2;
        m.sp=2+Math.random()*3;
        m.len=50+Math.random()*70;
      }
      const ex=m.x-m.sp*2.2,ey=m.y+m.sp;
      const grad=ctx.createLinearGradient(m.x,m.y,ex,ey);
      grad.addColorStop(0,'rgba(255,255,255,'+m.a+')');
      grad.addColorStop(1,'rgba(255,255,255,0)');
      ctx.beginPath();ctx.moveTo(m.x,m.y);
      ctx.lineTo(ex,ey);
      ctx.strokeStyle=grad;ctx.lineWidth=1;ctx.stroke();
      // Bright head
      ctx.beginPath();ctx.arc(m.x,m.y,1.2,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+m.a+')';ctx.fill();
      m.x-=m.sp*0.7;m.y+=m.sp*0.3;m.a-=0.01;m.life--;
    }

    animId=requestAnimationFrame(draw);
  }
  resize();initStars(50);draw();
  window.addEventListener('resize',()=>{resize();initStars(50)});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){cancelAnimationFrame(animId)}else{animId=requestAnimationFrame(draw)}
  });
})();

// ── Cursor Spotlight ──
document.addEventListener('mousemove',e=>{
  const s=document.getElementById('cursor-spot');
  s.style.setProperty('--mx',e.clientX+'px');
  s.style.setProperty('--my',e.clientY+'px');
});

// ── Scroll Reveal ──
const revealObserver=new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){entry.target.classList.add('in-view')}
  });
},{threshold:0.08});
function initReveal(){
  document.querySelectorAll('.reveal,.reveal-scale').forEach(el=>revealObserver.observe(el));
}
// Retry until React mounts
let _r=setInterval(()=>{
  const els=document.querySelectorAll('.reveal,.reveal-scale');
  if(els.length){initReveal();clearInterval(_r)}
},50);
setTimeout(()=>clearInterval(_r),8000);
</script>

/* ─── Helper Components ─── */
function MagneticWrap({children}){
  const ref=useRef(null);const [pos,setPos]=useState({x:0,y:0});
  const handleMove=useCallback((e)=>{
    if(!ref.current)return;
    const r=ref.current.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    const dx=e.clientX-cx,dy=e.clientY-cy;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const f=Math.max(0,1-dist/200);
    setPos({x:dx*f*0.3,y:dy*f*0.3});
  },[]);
  const handleLeave=useCallback(()=>setPos({x:0,y:0}),[]);
  return <div ref={ref} onMouseMove={handleMove} onMouseLeave={handleLeave} style={{display:'inline-flex',transform:`translate(${pos.x}px,${pos.y}px)`,transition:'transform 0.15s ease-out'}}>{children}</div>;
}

function GlowText({children,as='span',style={}}){
  const Tag=as;
  return <Tag style={{color:'var(--primary)',textShadow:'0 0 30px var(--primary-glow), 0 0 60px var(--primary-glow)',...style}}>{children}</Tag>;
}

    const observer=new IntersectionObserver((entries)=>{
      entries.forEach(entry=>{if(entry.isIntersecting)setActive(entry.target.id)});
    },{threshold:0.3,rootMargin:'-80px 0px 0px 0px'});
    NAV_ITEMS.forEach(({id})=>{const el=document.getElementById(id);if(el)observer.observe(el)});
    return ()=>observer.disconnect();
  },[]);
  return(
    <div className="dock-wrap">
      <div className="dock">
        {NAV_ITEMS.map((item,i)=>(
          <React.Fragment key={item.id}>
            {i>0&&<div className="dock-sep"/>}
            <button className={`dock-btn${active===item.id?' active':''}`} onClick={()=>handleClick(item.id)} aria-label={item.label}>
              {React.createElement(DOCK_ICONS[i])}
              <span className="tooltip">{item.label}</span>
            </button>
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

/* ─── Project Card (with ripple + 3D tilt) ─── */
function ProjectCard({project,index}){
  const cardRef=useRef(null);
  const [hovered,setHovered]=useState(false);
  useEffect(()=>{
    const card=cardRef.current;if(!card)return;
    const onMove=(e)=>{const r=card.getBoundingClientRect();card.style.setProperty('--rx',((e.clientY-r.top)/r.height-0.5)*-12+'deg');card.style.setProperty('--ry',((e.clientX-r.left)/r.width-0.5)*12+'deg')};
    const onLeave=()=>{card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg')};
    card.addEventListener('mousemove',onMove);card.addEventListener('mouseleave',onLeave);
    return ()=>{card.removeEventListener('mousemove',onMove);card.removeEventListener('mouseleave',onLeave)};
  },[]);

  const handleRipple=(e)=>{
    const card=cardRef.current;if(!card)return;
    const container=card.querySelector('.ripple-container');if(!container)return;
    const r=container.getBoundingClientRect();
    const ripple=document.createElement('span');ripple.className='ripple';
    const size=Math.max(r.width,r.height);
    ripple.style.width=ripple.style.height=size+'px';
    ripple.style.left=e.clientX-r.left-size/2+'px';
    ripple.style.top=e.clientY-r.top-size/2+'px';
    container.appendChild(ripple);
    ripple.addEventListener('animationend',()=>ripple.remove());
  };

  const isFeatured=index===0;
  return(
    <div ref={cardRef} className={`project-card${isFeatured?' featured':''}`} onMouseEnter={()=>setHovered(true)} onMouseLeave={()=>setHovered(false)} onClick={handleRipple}>
      <div className="ripple-container" />
      <div className="project-thumb">
        <div className="project-thumb-grid" />
        {project.svg&&<div className="project-thumb-img">{React.createElement(project.svg)}</div>}
        <div className="project-thumb-label">
          <span className="project-icon">{project.icon}</span>
          {project.title}
        </div>
        <div className="project-thumb-dots"><span/><span/><span/></div>
      </div>
      <div className="project-body">
        {project.status&&<div className="project-badge"><StatusDot status={project.status}/></div>}
        <div className="project-tag-row">{project.tags.map(t=><span key={t} className="project-tag">{t}</span>)}</div>
        <div className="project-name">{project.title}</div>
        <p className="project-desc">{project.desc}</p>
        <div className="project-links">{project.links.map((l,i)=><a key={i} href={l.url} target={l.external?'_blank':undefined} rel={l.external?'noopener noreferrer':undefined} className="project-link">{l.external?'↗ ':''}{l.label}</a>)}</div>
      </div>
    </div>
  );
}

}

/* ─── GothicKatana ─── */
function GothicKatana({accent}){
  const wrapRef=useRef(null);
  const svgRef=useRef(null);
  const rafRef=useRef(null);
  const targetRot=useRef(-1.5);
  const currentRot=useRef(-1.5);
  const targetScale=useRef(1);
  const currentScale=useRef(1);
  const targetY=useRef(0);
  const currentY=useRef(0);
  const [swinging,setSwinging]=useState(false);
  const [sparks,setSparks]=useState([]);
  const [mouseOver,setMouseOver]=useState(false);
  const clickGuard=useRef(false);

  // ── Smooth animation loop ──
  useEffect(()=>{
    const lerp=(a,b,t)=>a+(b-a)*t;
    const tick=()=>{
      currentRot.current=lerp(currentRot.current,targetRot.current,0.07);
      currentScale.current=lerp(currentScale.current,targetScale.current,0.08);
      currentY.current=lerp(currentY.current,targetY.current,0.06);
      if(svgRef.current){
        svgRef.current.style.transform=`translateY(${currentY.current}px) scale(${currentScale.current}) rotate(${currentRot.current}deg)`;
      }
      rafRef.current=requestAnimationFrame(tick);
    };
    rafRef.current=requestAnimationFrame(tick);
    return ()=>cancelAnimationFrame(rafRef.current);
  },[]);

  // ── Mouse tracking ──
  useEffect(()=>{
    const onMove=(e)=>{
      if(!wrapRef.current)return;
      const r=wrapRef.current.getBoundingClientRect();
      const cx=r.left+r.width/2,cy=r.top+r.height/4;
      const dx=(e.clientX-cx)/r.width,dy=(e.clientY-cy)/r.height;
      targetRot.current=-1.5+dx*3.5;
      targetScale.current=1+Math.max(0,0.06-Math.abs(dx)*0.03);
      targetY.current=-dy*6;
    };
    window.addEventListener('mousemove',onMove,{passive:true});
    return ()=>window.removeEventListener('mousemove',onMove);
  },[]);

  // ── Hover glow ──
  useEffect(()=>{
    const onEnter=()=>setMouseOver(true);
    const onLeave=()=>{setMouseOver(false);targetRot.current=-1.5;targetScale.current=1;targetY.current=0};
    const w=wrapRef.current;
    if(w){w.addEventListener('mouseenter',onEnter);w.addEventListener('mouseleave',onLeave)}
    return ()=>{if(w){w.removeEventListener('mouseenter',onEnter);w.removeEventListener('mouseleave',onLeave)}};
  },[]);

  // ── Click slash ──
  useEffect(()=>{
    const onClick=(e)=>{
      if(!wrapRef.current||clickGuard.current)return;
      clickGuard.current=true;
      // Generate sparks
      const newSparks=[];
      for(let i=0;i<12;i++){
        newSparks.push({
          id:Date.now()+i,
          sx:(Math.random()-0.5)*60,
          sy:-20-Math.random()*50,
          delay:Math.random()*0.15,
          dur:0.3+Math.random()*0.4,
          x:96+Math.random()*8,
          y:60+Math.random()*120,
        });
      }
      setSparks(newSparks);
      // Slash animation via CSS class
      setSwinging(true);
      // Quick rotation bounce
      targetRot.current=8;
      setTimeout(()=>{
        targetRot.current=-1.5;
        setTimeout(()=>{setSwinging(false);clickGuard.current=false;setSparks([])},400);
      },150);
    };
    const w=wrapRef.current;
    if(w)w.addEventListener('click',onClick);
    return ()=>{if(w)w.removeEventListener('click',onClick)};
  },[]);

  // ── Random idle swing ──
  useEffect(()=>{
    let timeout;
    const schedule=()=>{
      timeout=setTimeout(()=>{
        if(!clickGuard.current){
          targetRot.current=6;
          setTimeout(()=>targetRot.current=-1.5,120);
        }
        schedule();
      },6000+Math.random()*6000);
    };
    schedule();
    return ()=>clearTimeout(timeout);
  },[]);

  // ── Scroll awareness ──
  useEffect(()=>{
    const onScroll=()=>{
      const scrollY=window.scrollY;
      const docH=document.documentElement.scrollHeight-window.innerHeight;
      const progress=scrollY/docH;
      // Subtle glow increase near bottom
      if(wrapRef.current){
        const glow=0.15+progress*0.2;
        wrapRef.current.style.filter=`drop-shadow(0 0 ${15+progress*25}px var(--primary-glow))`;
      }
    };
    window.addEventListener('scroll',onScroll,{passive:true});
    return ()=>window.removeEventListener('scroll',onScroll);
  },[]);

  const c=accent||'#ccc';
  const c2=accent||'#aaa';
  const gradId='K'+Math.random().toString(36).slice(2,6);

  return(
    <div className="katana-wrap" ref={wrapRef} style={{pointerEvents:'auto',opacity:swinging?0.95:1}}>
      {/* Sparks */}
      {sparks.map(s=>(
        <div key={s.id} style={{
          position:'absolute',left:s.x,top:s.y,width:3,height:3,
          borderRadius:'50%',background:c,opacity:0,
          animation:`spark ${s.dur}s ease-out ${s.delay}s forwards`,
          '--sx':s.sx+'px','--sy':s.sy+'px',pointerEvents:'none',zIndex:51,
        }}/>
      ))}
      <svg className={`katana-svg${swinging?' swinging':''}`}
        ref={svgRef}
        viewBox="0 0 200 460" fill="none" xmlns="http://www.w3.org/2000/svg"
        style={{transform:`rotate(-1.5deg)`,filter:mouseOver?'brightness(1.15)':'none',transition:'filter 0.4s'}}>
        <defs>
          {/* Blade steel gradient */}
          <linearGradient id={gradId+'s'} x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor={c} stopOpacity="0.7"/>
            <stop offset="25%" stopColor="#e8e8ec" stopOpacity="0.9"/>
            <stop offset="50%" stopColor="#fff" stopOpacity="1"/>
            <stop offset="75%" stopColor={c2} stopOpacity="0.85"/>
            <stop offset="100%" stopColor={c} stopOpacity="0.6"/>
          </linearGradient>
          {/* Edge gradient */}
          <linearGradient id={gradId+'e'} x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="#fff" stopOpacity="0.4"/>
            <stop offset="100%" stopColor={c} stopOpacity="0"/>
          </linearGradient>
          {/* Hamon glow */}
          <linearGradient id={gradId+'h'} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={c} stopOpacity="0.06"/>
            <stop offset="50%" stopColor={c} stopOpacity="0.02"/>
            <stop offset="100%" stopColor={c} stopOpacity="0.06"/>
          </linearGradient>
          <filter id={gradId+'g'}>
            <feGaussianBlur stdDeviation="2"/>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id={gradId+'sg'}><feGaussianBlur stdDeviation="1.2"/></filter>
        </defs>

        {/* === BLADE === */}
        {/* Main blade — katana form with gradual taper and curve */}
        <g>
          {/* Blade shadow/glow background */}
          <path d="M100 16 C103 18,105 40,104 65 L102 190 L98 190 L96 65 C95 40,96 18,98 16 L99 14Z"
            fill={c} opacity="0.2" filter={`url(#${gradId+'sg'})`}/>
          <path d="M100 16 C103 18,105 40,104 65 L102 190 L98 190 L96 65 C95 40,96 18,98 16 L99 14Z"
            fill={`url(#${gradId+'s'})`} opacity="0.6" filter={`url(#${gradId+'g'})`}/>
          <path d="M100 16 C103 18,105 40,104 65 L102 190 L98 190 L96 65 C95 40,96 18,98 16 L99 14Z"
            fill={`url(#${gradId+'s'})`} opacity="0.3"/>

          {/* Kissaki (tip) highlight */}
          <path d="M100 16 C102 17,103 22,102 28 L100 30 L98 28 C97 22,98 17,100 16Z"
            fill="#fff" opacity="0.06"/>

          {/* Shinogi (ridge highlight) */}
          <path d="M100 18 C101 22,101.5 40,101.5 65 L100.5 185"
            stroke="#fff" strokeWidth="0.4" opacity="0.1"/>

          {/* Hamon (wavy temper line) */}
          <path d="M98 32 Q94 36,98 40 T98 48 T98 56 T98 64 T98 72 T98 80 T98 88 T98 96 T98 104 T98 112 T98 120 T98 128 T98 136 T98 144 T98 152 T98 160 T98 168 T98 176 T98 184"
            stroke="#fff" strokeWidth="0.5" opacity="0.06" fill="none"/>

          {/* Edge (ha) — bright line */}
          <path d="M97.5 30 L96.8 65 L96.3 130 L96.8 180"
            stroke={`url(#${gradId+'e'})`} strokeWidth="0.7" opacity="0.25"/>
          <path d="M97 34 L96.3 70 L95.8 130 L96.3 175"
            stroke="#fff" strokeWidth="0.15" opacity="0.12"/>

          {/* Blade surface reflection */}
          <path d="M101.5 30 Q103 70,102 110 Q101 150,100.5 180"
            stroke="#fff" strokeWidth="0.3" opacity="0.06"/>
          <path d="M102 40 Q103.5 80,102.5 120 Q102 155,101.5 180"
            stroke="#fff" strokeWidth="0.15" opacity="0.04"/>

          {/* Dynamic highlight — moves with mouse */}
          <path d="M99 35 L101 35 L101 175 L99 175Z"
            fill="#fff" opacity={0.02+Math.abs(targetRot.current+1.5)*0.01}
            filter={`url(#${gradId+'sg'})`}/>
        </g>

        {/* === HABAKI (blade collar) === */}
        <rect x="96.5" y="190" width="7" height="5" rx="0.5" fill="rgba(40,40,50,0.5)" stroke={c} strokeWidth="0.2" opacity="0.4"/>

        {/* === TSUBA (guard) — round with cutouts === */}
        <g opacity="0.7">
          <ellipse cx="100" cy="197" rx="20" ry="7" fill="rgba(15,15,20,0.85)" stroke={c} strokeWidth="0.6"/>
          <ellipse cx="100" cy="197" rx="16" ry="5.5" fill="none" stroke={c} strokeWidth="0.2" opacity="0.3"/>
          {/* Kozuka & Kogai holes */}
          <rect x="84" y="194.5" width="2.5" height="5" rx="1" fill="var(--bg)" opacity="0.4"/>
          <rect x="113.5" y="194.5" width="2.5" height="5" rx="1" fill="var(--bg)" opacity="0.4"/>
          {/* Decorative grooves */}
          <path d="M93 197 Q96.5 194,100 197 Q103.5 200,107 197" stroke={c} strokeWidth="0.3" fill="none" opacity="0.15"/>
        </g>

        {/* === TSUKA (handle) with ito (wrap) === */}
        <g>
          {/* Core handle */}
          <rect x="96" y="204" width="8" height="60" rx="2" fill="rgba(8,8,12,0.95)" opacity="0.8"/>
          {/* Ito (diamond wrap pattern) */}
          {[0,1,2,3,4,5,6].map(i=>{
            const yy=206+i*8;
            const ww=0.5;
            return <g key={i} opacity={0.25}>
              {/* Left diamonds */}
              <path d={`M96 ${yy} Q93 ${yy+3},96 ${yy+6} Q99 ${yy+3},96 ${yy}`}
                stroke={c} strokeWidth={ww} fill="none"/>
              {/* Right diamonds */}
              <path d={`M104 ${yy} Q107 ${yy+3},104 ${yy+6} Q101 ${yy+3},104 ${yy}`}
                stroke={c} strokeWidth={ww} fill="none"/>
              {/* Cross wraps */}
              <line x1="96" y1={yy+2} x2="104" y2={yy+4} stroke={c} strokeWidth="0.2" opacity="0.15"/>
              <line x1="96" y1={yy+4} x2="104" y2={yy+2} stroke={c} strokeWidth="0.2" opacity="0.15"/>
            </g>;
          })}
          {/* Menuki (ornament) */}
          <ellipse cx="100" cy="232" rx="2.5" ry="3.5" fill={c} opacity="0.06"/>
          {/* Tsuka-ito knots at ends */}
          <line x1="96" y1="206" x2="104" y2="208" stroke={c} strokeWidth="0.3" opacity="0.15"/>
          <line x1="96" y1="208" x2="104" y2="206" stroke={c} strokeWidth="0.3" opacity="0.15"/>
        </g>

        {/* === KASHIRA (pommel) === */}
        <g opacity="0.5">
          <path d="M95.5 264 Q100 269,104.5 264 Q100 267.5,95.5 264Z"
            stroke={c} strokeWidth="0.6" fill="rgba(12,12,16,0.8)"/>
          <ellipse cx="100" cy="266" rx="4.5" ry="2" stroke={c} strokeWidth="0.2" fill="none" opacity="0.2"/>
        </g>

        {/* === SAGEO (cord) === */}
        <path d="M110 200 Q118 210,112 228 Q108 240,114 252"
          stroke={c} strokeWidth="0.4" fill="none" opacity="0.08" strokeLinecap="round"/>

        {/* === GLOW AURA (dual layer) === */}
        <ellipse cx="100" cy="105" rx="14" ry="95" fill={c} opacity="0.025" className="kg-glow"
          filter={`url(#${gradId+'sg'})`} style={{animation:'kgGlow 4s ease-in-out infinite'}}/>
        <ellipse cx="100" cy="105" rx="6" ry="90" fill={c} opacity="0.02" className="kg-glow"
          style={{animation:'kgGlow 3s ease-in-out infinite'}}/>

        {/* === PARTICLES === */}
        {/* Floating motes */}
        {[30,55,80,105,130,155].map((y,i)=>{
          const phase=i*1.8;
          return <circle key={i}
            cx={99+Math.sin(phase)*10}
            cy={y+Math.sin(phase*0.5)*3}
            r={0.3+Math.sin(phase)*0.2}
            fill={c}
            style={{animation:`kgPulse ${2+i*0.3}s ease-in-out infinite`,animationDelay:`${i*0.2}s`}}
            opacity="0"/>
        })}

        {/* Rising embers */}
        {[0,1,2,3].map(i=>(
          <circle key={'e'+i}
            cx={100+Math.sin(i*2.2)*2}
            cy={25+i*35}
            r={0.25}
            fill={c}
            opacity="0"
            style={{animation:`kgPulse ${3+i*0.5}s ease-in-out infinite`,animationDelay:`${i*0.6}s`}}/>
        ))}
      </svg>
    </div>
  );
}

/* ─── Tweaks Panel ─── */
function TweaksPanel({children}){
  const [open,setOpen]=useState(false);
  return(<>
    <button className="tweaks-toggle" onClick={()=>setOpen(!open)} title="Settings">⚙</button>
    {open&&<div className="tweaks-panel">{children}</div>}
    {open&&<div style={{position:'fixed',inset:0,zIndex:997}} onClick={()=>setOpen(false)} />}
  </>);
}
function TweakSection({title,children}){
  return<div className="tweak-section"><div className="tweak-section-title">{title}</div>{children}</div>;
}
function TweakSlider({label,tweakKey,min,max,step,tweaks,setTweaks}){
  return<div className="tweak-row"><span className="tweak-label">{label}</span><input type="number" className="tweak-input" value={tweaks[tweakKey]} min={min} max={max} step={step} onChange={e=>setTweaks({...tweaks,[tweakKey]:Number(e.target.value)})}/></div>;
}
function TweakToggle({label,tweakKey,tweaks,setTweaks}){
  return<div className="tweak-row"><span className="tweak-label">{label}</span><button className={`tweak-toggle-btn ${tweaks[tweakKey]?'on':'off'}`} onClick={()=>setTweaks({...tweaks,[tweakKey]:!tweaks[tweakKey]})}/></div>;
}
function TweakColor({label,tweakKey,tweaks,setTweaks}){
  return<div className="tweak-row"><span className="tweak-label">{label}</span><input type="color" className="color-picker" value={tweaks[tweakKey]} onChange={e=>setTweaks({...tweaks,[tweakKey]:e.target.value})}/></div>;
}

const defaultTweaks={accentColor:'#cccccc',particleCount:40,katanaEnabled:true};

/* ─── App ─── */
function App(){
  const [tweaks,setTweaks]=useState({...defaultTweaks});
  const [showKatana,setShowKatana]=useState(true);
  useEffect(()=>{
    const check=()=>setShowKatana(window.innerWidth>768);
    check();window.addEventListener('resize',check);
    return ()=>window.removeEventListener('resize',check);
  },[]);

  return(
    <>
      <Hero/>
      <AboutSection/>
      <SkillsSection/>
      <ExperienceSection/>
      <ProjectsSection/>
      <ServicesSection/>
      <ContactSection/>
      <footer>
        <div className="footer-copy">© 2026 x1yzl — All Rights Reserved</div>
        <div className="footer-tagline">Developer · Apprentice · Forever Learning</div>
      </footer>
      <Dock/>
      {showKatana&&tweaks.katanaEnabled&&<GothicKatana accent={tweaks.accentColor}/>}
      <TweaksPanel>
        <TweakSection title="Appearance">
          <TweakColor label="Accent Color" tweakKey="accentColor" tweaks={tweaks} setTweaks={setTweaks}/>
        </TweakSection>
        <TweakSection title="Particles">
          <TweakSlider label="Count" tweakKey="particleCount" tweaks={tweaks} setTweaks={setTweaks} min={10} max={150} step={5}/>
        </TweakSection>
        <TweakSection title="Effects">
          <TweakToggle label="Katana" tweakKey="katanaEnabled" tweaks={tweaks} setTweaks={setTweaks}/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
