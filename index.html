<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>x1yzl — Engineering, Developer & Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Share+Tech+Mono&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --blood: #8B0000;
    --blood-dim: #5a0000;
    --blood-glow: #a01515;
    --ink: #040305;
    --ink-mid: #07050a;
    --ink-light: #0e0b14;
    --parchment: #d6cfc8;
    --parchment-dim: #a09890;
    --ash: #1e1824;
    --bone: #f0ece6;
    --font-display: 'Cinzel Decorative', serif;
    --font-serif: 'Cinzel', serif;
    --font-mono: 'Share Tech Mono', monospace;
    --font-body: 'IM Fell English', serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background-color: var(--ink);
    color: var(--bone);
    font-family: var(--font-body);
    overflow-x: hidden;
    cursor: none;
    /* deep dark grain texture */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.03'/%3E%3C/svg%3E");
  }

  /* ── CUSTOM CURSOR ── */
  #cursor-dot {
    position: fixed; top: 0; left: 0; width: 7px; height: 7px;
    background: #a01515;
    border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 10px rgba(139,0,0,0.8), 0 0 20px rgba(90,0,0,0.5);
    transition: transform 0.05s, background 0.2s;
  }
  #cursor-ring {
    position: fixed; top: 0; left: 0; width: 36px; height: 36px;
    border: 1px solid rgba(139,0,0,0.6);
    border-radius: 50%;
    pointer-events: none; z-index: 9998;
    transform: translate(-50%,-50%);
    transition: transform 0.18s cubic-bezier(.17,.67,.35,1.2), width 0.2s, height 0.2s, border-color 0.2s;
    opacity: 0.7;
  }
  body:has(a:hover) #cursor-ring,
  body:has(button:hover) #cursor-ring {
    width: 56px; height: 56px;
    border-color: rgba(139,0,0,0.9);
    opacity: 1;
  }

  /* ── CANVAS BACKGROUND ── */
  #bg-canvas {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
  }

  /* ── NOISE OVERLAY ── */
  .noise-overlay {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    opacity: 0.07;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 180px 180px;
    animation: noiseShift 0.4s steps(2) infinite;
  }
  @keyframes noiseShift { 0%{background-position:0 0} 50%{background-position:40px 25px} 100%{background-position:0 0} }

  /* ── VIGNETTE ── */
  .vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.92) 100%);
  }

  /* ── MAIN LAYOUT ── */
  #app { position: relative; z-index: 3; }

  /* ── NAVIGATION ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 4rem;
    border-bottom: 1px solid rgba(139,0,0,0.2);
    backdrop-filter: blur(20px);
    background: rgba(4,3,5,0.88);
    transition: background 0.3s;
  }
  .nav-logo {
    font-family: var(--font-display);
    font-size: 1.4rem;
    color: #c8c0b8;
    letter-spacing: 0.1em;
    text-shadow: 0 0 30px rgba(139,0,0,0.6), 0 0 60px rgba(90,0,0,0.4);
    text-decoration: none;
    transition: color 0.3s;
  }
  .nav-logo:hover { color: var(--bone); }
  .nav-links {
    display: flex; gap: 2.5rem; list-style: none;
  }
  .nav-links a {
    font-family: var(--font-serif);
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #7a7470;
    text-decoration: none;
    position: relative;
    transition: color 0.3s;
  }
  .nav-links a::after {
    content: '';
    position: absolute; bottom: -4px; left: 0; right: 0; height: 1px;
    background: var(--blood);
    transform: scaleX(0); transform-origin: right;
    transition: transform 0.3s ease;
  }
  .nav-links a:hover { color: #e0dbd5; }
  .nav-links a:hover::after { transform: scaleX(1); transform-origin: left; }

  /* ── HERO ── */
  #hero {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 8rem 2rem 9rem;
    position: relative;
    overflow: hidden;
  }
  .hero-sigil {
    width: 180px; height: 180px;
    margin-bottom: 2.5rem;
    position: relative;
    animation: sigilSpin 20s linear infinite;
  }
  @keyframes sigilSpin { to { transform: rotate(360deg); } }
  .hero-sigil-inner {
    position: absolute; inset: 12px;
    animation: sigilSpin 10s linear infinite reverse;
  }
  .hero-eyeline {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    color: #6b0000;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
    opacity: 0;
    animation: rv-drop 1s 0.2s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .hero-name {
    font-family: var(--font-display);
    font-size: clamp(3.5rem, 9vw, 8rem);
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: 0.04em;
    color: #f5f0ea;
    text-shadow: 0 0 80px rgba(139,0,0,0.35), 0 4px 0 rgba(0,0,0,0.95), 0 0 140px rgba(90,0,0,0.2);
    opacity: 0;
    animation: rv-flip 1.1s 0.4s cubic-bezier(0.16,1,0.3,1) forwards;
    position: relative;
  }
  .hero-name .glitch-text { display: inline-block; }
  .hero-tagline {
    font-family: var(--font-serif);
    font-size: clamp(0.9rem, 2vw, 1.2rem);
    color: #9a9490;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-top: 1.2rem;
    opacity: 0;
    animation: rv-right 1s 0.65s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .hero-divider {
    width: 200px; height: 1px;
    background: linear-gradient(90deg, transparent, #8B0000, transparent);
    margin: 2.5rem auto;
    opacity: 0;
    animation: rv-expand 0.9s 0.85s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .hero-desc {
    max-width: 520px;
    font-size: 1.1rem;
    line-height: 1.9;
    color: #c8c4be;
    font-style: italic;
    opacity: 0;
    animation: rv-rise 1s 1s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .hero-ctas {
    display: flex; gap: 1.5rem; margin-top: 3rem;
    opacity: 0;
    animation: rv-pop 1.05s 1.2s cubic-bezier(0.16,1,0.3,1) forwards;
    flex-wrap: wrap; justify-content: center;
  }

  /* ── 3D KEYFRAMES ── */
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  /* rise — default: floats up from below with perspective X-tilt */
  @keyframes rv-rise {
    from { opacity:0; transform: perspective(900px) translateY(70px)  rotateX(-22deg); }
    to   { opacity:1; transform: perspective(900px) translateY(0)      rotateX(0deg);  }
  }
  /* drop — falls from above with forward tilt — labels, eyeline text */
  @keyframes rv-drop {
    from { opacity:0; transform: perspective(900px) translateY(-55px) rotateX(30deg) scale(0.94); }
    to   { opacity:1; transform: perspective(900px) translateY(0)      rotateX(0deg)  scale(1);    }
  }
  /* left — sweeps in from the left with Y-axis rotation — portrait, left items */
  @keyframes rv-left {
    from { opacity:0; transform: perspective(900px) translateX(-90px) rotateY(38deg); }
    to   { opacity:1; transform: perspective(900px) translateX(0)      rotateY(0deg); }
  }
  /* right — sweeps in from the right — tagline, right-anchored items */
  @keyframes rv-right {
    from { opacity:0; transform: perspective(900px) translateX(90px)  rotateY(-38deg); }
    to   { opacity:1; transform: perspective(900px) translateX(0)       rotateY(0deg);  }
  }
  /* flip — dramatic X-axis fold-in — section titles, hero name */
  @keyframes rv-flip {
    from { opacity:0; transform: perspective(700px) rotateX(-85deg) translateY(50px) scale(0.88); }
    65%  {            transform: perspective(700px) rotateX(7deg)   translateY(-7px) scale(1.02); }
    to   { opacity:1; transform: perspective(700px) rotateX(0deg)   translateY(0)    scale(1);    }
  }
  /* pop — scale + multi-axis burst — cards, CTAs, stats */
  @keyframes rv-pop {
    from { opacity:0; transform: perspective(900px) scale(0.65) rotateY(25deg) rotateX(20deg); }
    65%  {            transform: perspective(900px) scale(1.05) rotateY(-3deg) rotateX(-3deg);  }
    to   { opacity:1; transform: perspective(900px) scale(1)    rotateY(0deg)  rotateX(0deg);  }
  }
  /* spin-in — diagonal spin — skill categories */
  @keyframes rv-spin-in {
    from { opacity:0; transform: perspective(900px) translateY(60px) rotateZ(-16deg) rotateX(-28deg) scale(0.80); }
    70%  {            transform: perspective(900px) translateY(-7px)  rotateZ(2deg)  rotateX(3deg)   scale(1.02); }
    to   { opacity:1; transform: perspective(900px) translateY(0)     rotateZ(0deg)  rotateX(0deg)   scale(1);    }
  }
  /* expand — grows on X axis with Y-rotation — dividers, separators */
  @keyframes rv-expand {
    from { opacity:0; transform: perspective(900px) scaleX(0)   rotateY(-25deg); }
    to   { opacity:1; transform: perspective(900px) scaleX(1)   rotateY(0deg);   }
  }

  /* ── SCROLL INDICATOR ── */
  .scroll-indicator {
    position: absolute; bottom: 2.5rem; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    opacity: 0;
    animation: fadeIn 1s 2s forwards;
  }
  .scroll-indicator span {
    font-family: var(--font-mono); font-size: 0.6rem;
    letter-spacing: 0.3em; color: #6b0000; text-transform: uppercase;
  }
  .scroll-line {
    width: 1px; height: 50px;
    background: linear-gradient(to bottom, #8B0000, transparent);
    animation: scrollPulse 2s ease-in-out infinite;
  }
  @keyframes scrollPulse { 0%,100%{opacity:0.3;transform:scaleY(1)} 50%{opacity:1;transform:scaleY(1.2)} }

  /* ── BUTTONS ── */
  .btn-primary {
    font-family: var(--font-serif);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #f0ece6;
    background: linear-gradient(160deg, #8a0000 0%, #5a0000 100%);
    border: none;
    padding: 1rem 2.5rem;
    cursor: none;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    display: inline-block;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    transform: perspective(700px) translateY(0) translateZ(0);
    transition:
      transform   0.28s cubic-bezier(0.23, 1, 0.32, 1),
      box-shadow  0.28s cubic-bezier(0.23, 1, 0.32, 1),
      background  0.28s;
    box-shadow:
      0 5px 0 #220000,
      0 8px 28px rgba(139,0,0,0.38),
      inset 0 1px 0 rgba(255,255,255,0.1);
  }
  /* bevel top-face highlight */
  .btn-primary::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 45%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.13), transparent);
    pointer-events: none;
  }
  /* shimmer sweep on hover */
  .btn-primary::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 30%, rgba(255,120,120,0.2) 50%, transparent 70%);
    transform: translateX(-150%);
    transition: transform 0.55s ease;
    pointer-events: none;
  }
  .btn-primary:hover {
    background: linear-gradient(160deg, #aa1414 0%, #7a0000 100%);
    transform: perspective(700px) translateY(-7px) rotateX(12deg) translateZ(6px);
    box-shadow:
      0 13px 0 #140000,
      0 20px 55px rgba(139,0,0,0.68),
      0 0  100px rgba(139,0,0,0.28),
      inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .btn-primary:hover::after { transform: translateX(150%); }
  .btn-primary:active {
    transform: perspective(700px) translateY(-2px) rotateX(5deg) translateZ(2px);
    box-shadow:
      0 3px 0 #220000,
      0 5px 18px rgba(139,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.08);
    transition-duration: 0.08s;
  }

  .btn-ghost {
    font-family: var(--font-serif);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #c84040;
    background: transparent;
    border: 1px solid rgba(139,0,0,0.5);
    padding: 1rem 2.5rem;
    cursor: none;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    display: inline-block;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    transform: perspective(700px) translateY(0) translateZ(0);
    transition:
      transform    0.28s cubic-bezier(0.23, 1, 0.32, 1),
      box-shadow   0.28s cubic-bezier(0.23, 1, 0.32, 1),
      color        0.28s,
      border-color 0.28s;
    box-shadow:
      0 5px 0 rgba(80,0,0,0.35),
      0 6px 20px rgba(139,0,0,0.12);
  }
  /* fill layer — slides in from left */
  .btn-ghost::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #8B0000, #5a0000);
    transform: scaleX(0) scaleY(0.85);
    transform-origin: left center;
    transition: transform 0.38s cubic-bezier(0.23, 1, 0.32, 1);
    z-index: -1;
  }
  /* bevel top-face highlight */
  .btn-ghost::after {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 45%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.07), transparent);
    opacity: 0;
    transition: opacity 0.28s;
    pointer-events: none;
  }
  .btn-ghost:hover {
    color: #f0ece6;
    border-color: #8B0000;
    transform: perspective(700px) translateY(-7px) rotateX(12deg) translateZ(6px);
    box-shadow:
      0 13px 0 rgba(60,0,0,0.55),
      0 20px 55px rgba(139,0,0,0.52),
      0 0   70px rgba(139,0,0,0.22);
  }
  .btn-ghost:hover::before { transform: scaleX(1) scaleY(1); }
  .btn-ghost:hover::after  { opacity: 1; }
  .btn-ghost:active {
    transform: perspective(700px) translateY(-2px) rotateX(5deg) translateZ(2px);
    box-shadow:
      0 3px 0 rgba(80,0,0,0.5),
      0 5px 15px rgba(139,0,0,0.3);
    transition-duration: 0.08s;
  }

  /* ── SECTION BASE ── */
  section { position: relative; padding: 8rem 2rem; }
  .section-inner { max-width: 1200px; margin: 0 auto; }

  .section-label {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.4em;
    color: #7a0000;
    text-transform: uppercase;
    margin-bottom: 1rem;
    display: flex; align-items: center; gap: 1rem;
  }
  .section-label::after {
    content: '';
    flex: 1; max-width: 80px; height: 1px;
    background: var(--blood);
  }
  .section-title {
    font-family: var(--font-display);
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
    color: #f2ede8;
    line-height: 1.1;
    text-shadow: 0 0 60px rgba(139,0,0,0.2), 0 2px 0 rgba(0,0,0,0.9);
    margin-bottom: 1.5rem;
  }
  .section-sep {
    width: 60px; height: 2px;
    background: #8B0000;
    margin-bottom: 3rem;
  }

  /* ── ABOUT ── */
  #about {
    background: transparent;
  }
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 5rem;
    align-items: center;
  }
  .about-portrait {
    position: relative;
  }
  .about-portrait-frame {
    width: 100%;
    aspect-ratio: 3/4;
    max-width: 340px;
    background: var(--ink-light);
    border: 1px solid rgba(139,0,0,0.3);
    position: relative;
    overflow: hidden;
  }
  .about-portrait-frame::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      45deg,
      rgba(139,0,0,0.03) 0px, rgba(139,0,0,0.03) 1px,
      transparent 1px, transparent 12px
    );
  }
  .portrait-placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 1rem;
    font-family: var(--font-mono); font-size: 0.65rem;
    letter-spacing: 0.15em; color: var(--blood-dim);
    text-align: center; padding: 2rem;
  }
  .portrait-placeholder svg { opacity: 0.3; }
  .about-portrait-decor {
    position: absolute;
    border: 1px solid rgba(139,0,0,0.2);
    top: -12px; left: -12px; right: 12px; bottom: 12px;
    pointer-events: none;
  }
  .about-portrait-decor2 {
    position: absolute;
    border: 1px solid rgba(139,0,0,0.1);
    top: 12px; left: 12px; right: -12px; bottom: -12px;
    pointer-events: none;
  }
  .about-text p {
    font-size: 1.1rem;
    line-height: 2.1;
    color: #c0bbb5;
    margin-bottom: 1.5rem;
  }
  .about-text p strong { color: #f0ece6; font-style: normal; font-weight: 700; }
  .about-stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem; margin-top: 3rem;
  }
  .stat-card {
    border: 1px solid rgba(139,0,0,0.2);
    padding: 1.5rem 1rem;
    text-align: center;
    background: rgba(139,0,0,0.04);
    transition: border-color 0.3s, background 0.3s;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(139,0,0,0.08), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .stat-card:hover { border-color: rgba(139,0,0,0.55); background: rgba(139,0,0,0.08); }
  .stat-card:hover::before { opacity: 1; }
  .stat-number {
    font-family: var(--font-display);
    font-size: 2.2rem;
    color: #9B1B1B;
    text-shadow: 0 0 30px rgba(139,0,0,0.5);
    display: block;
  }
  .stat-label {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    color: #8a8480;
    text-transform: uppercase;
    margin-top: 0.3rem;
    display: block;
  }

  /* ── SKILLS ── */
  #skills { background: transparent; }
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2rem;
  }
  .skill-category {
    border: 1px solid rgba(139,0,0,0.18);
    padding: 2rem;
    background: rgba(139,0,0,0.02);
    position: relative;
    overflow: hidden;
    transition: border-color 0.4s, transform 0.3s;
  }
  .skill-category::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--blood), transparent);
    transform: scaleX(0);
    transition: transform 0.4s ease;
  }
  .skill-category:hover { border-color: rgba(139,0,0,0.4); transform: translateY(-4px); }
  .skill-category:hover::before { transform: scaleX(1); }
  .skill-cat-title {
    font-family: var(--font-serif);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #9B1B1B;
    margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 0.8rem;
  }
  .skill-cat-title span { font-size: 1rem; }
  .skill-list { list-style: none; display: flex; flex-direction: column; gap: 0.8rem; }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── TWEAK DEFAULTS ──
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#8B0000",
  "particleCount": 60,
  "glitchEnabled": true,
  "dripsEnabled": true,
  "cursorTrailEnabled": true,
  "runesEnabled": true
}/*EDITMODE-END*/;

// ── CANVAS BACKGROUND — SATANIC STARS ──
function initCanvas(color) {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [], animId;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function hex2rgb(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return {r,g,b};
  }

  // Draw a 5-pointed star / inverted pentagram
  function drawStar5(cx, cy, outerR, innerR, rot) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const angle = (i * Math.PI / 5) - Math.PI / 2 + rot;
      const r = i % 2 === 0 ? outerR : innerR;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function makeParticle(count) {
    particles = [];
    const c = hex2rgb(color);

    // Background twinkle micro-dots — dense field of dim red specks
    for (let i = 0; i < count * 3; i++) {
      particles.push({
        type: 'dot',
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random()-0.5)*0.06, vy: (Math.random()-0.5)*0.06,
        r: Math.random()*1.1+0.2,
        baseAlpha: Math.random()*0.22+0.04,
        pulse: Math.random()*Math.PI*2,
        pulseSpeed: Math.random()*0.02+0.006,
        c
      });
    }

    // Pentagram stars — tiered sizes for depth
    for (let i = 0; i < count; i++) {
      const tier = Math.random();
      const size = tier < 0.09 ? Math.random()*12+10   // large  10–22 px
                 : tier < 0.32 ? Math.random()*5+4     // medium  4–9 px
                 :               Math.random()*3+0.8;   // small   0.8–3.8 px
      particles.push({
        type: 'star',
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random()-0.5)*0.1, vy: (Math.random()-0.5)*0.1,
        outerR: size,
        innerR: size * 0.38,
        rotation: Math.random()*Math.PI*2,
        rotSpeed: (Math.random()-0.5)*0.005*(size < 3 ? 3 : 1),
        baseAlpha: Math.random()*0.55+0.12,
        pulse: Math.random()*Math.PI*2,
        pulseSpeed: Math.random()*0.018+0.006,
        inverted: Math.random() < 0.35,   // 35 % are inverted pentagrams
        c
      });
    }
  }

  function draw() {
    ctx.clearRect(0,0,W,H);

    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      p.pulse += p.pulseSpeed;
      if (p.type === 'star') p.rotation += p.rotSpeed;

      if (p.x < -30) p.x = W+30; if (p.x > W+30) p.x = -30;
      if (p.y < -30) p.y = H+30; if (p.y > H+30) p.y = -30;

      const alpha = p.baseAlpha * (0.55 + 0.45*Math.sin(p.pulse));
      const {r:cr, g:cg, b:cb} = p.c;

      if (p.type === 'dot') {
        // Tiny glowing ember
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(${cr},${cg},${cb},${alpha})`;
        ctx.fill();
        if (p.r > 0.6) {
          const grd = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
          grd.addColorStop(0, `rgba(${cr},${cg},${cb},${alpha*0.35})`);
          grd.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r*4,0,Math.PI*2);
          ctx.fillStyle = grd; ctx.fill();
        }
      } else {
        const rot = p.inverted ? p.rotation + Math.PI : p.rotation;
        const pf  = 0.93 + 0.07*Math.sin(p.pulse*1.4);
        const oR  = p.outerR * pf;
        const iR  = p.innerR * pf;

        // Atmospheric glow halo
        if (oR > 5) {
          const haloR = oR * 5;
          const grd = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,haloR);
          grd.addColorStop(0,    `rgba(${cr},${cg},${cb},${alpha*0.22})`);
          grd.addColorStop(0.35, `rgba(${cr},${cg},${cb},${alpha*0.08})`);
          grd.addColorStop(1,    `rgba(${cr},${cg},${cb},0)`);
          ctx.beginPath(); ctx.arc(p.x,p.y,haloR,0,Math.PI*2);
          ctx.fillStyle = grd; ctx.fill();
        } else if (oR > 2) {
          const haloR = oR * 3.5;
          const grd = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,haloR);
          grd.addColorStop(0, `rgba(${cr},${cg},${cb},${alpha*0.28})`);
          grd.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
          ctx.beginPath(); ctx.arc(p.x,p.y,haloR,0,Math.PI*2);
          ctx.fillStyle = grd; ctx.fill();
        }

        // Star body
        drawStar5(p.x, p.y, oR, iR, rot);
        ctx.fillStyle = `rgba(${cr},${cg},${cb},${alpha})`;
        ctx.fill();
        if (oR > 2) {
          ctx.strokeStyle = `rgba(${Math.min(255,cr+55)},${cg},${cb},${alpha*0.55})`;
          ctx.lineWidth   = Math.max(0.3, oR*0.07);
          ctx.stroke();
        }
      }
    });

    animId = requestAnimationFrame(draw);
  }

  return { init: makeParticle, start: draw, stop: ()=>cancelAnimationFrame(animId) };
}

// ── CURSOR TRAIL ──
function initCursor(enabled) {
  const dot = document.getElementById('cursor-dot');
  const ring = document.getElementById('cursor-ring');
  let mx=0,my=0,rx=0,ry=0;
  let trailDots = [];
  const TRAIL_LEN = 12;

  if (enabled) {
    for (let i=0;i<TRAIL_LEN;i++) {
      const d = document.createElement('div');
      d.style.cssText=`position:fixed;top:0;left:0;width:${4-i*0.2}px;height:${4-i*0.2}px;background:var(--blood);border-radius:50%;pointer-events:none;z-index:9997;transform:translate(-50%,-50%);opacity:${(1-i/TRAIL_LEN)*0.4};transition:none;`;
      document.body.appendChild(d);
      trailDots.push({el:d,x:0,y:0});
    }
  }

  window.addEventListener('mousemove', e=>{
    mx=e.clientX; my=e.clientY;
    dot.style.left=mx+'px'; dot.style.top=my+'px';
    if (enabled && trailDots.length) trailDots[0]={el:trailDots[0].el,x:mx,y:my};
  });

  if (enabled) {
    let prev=[{x:0,y:0}];
    function updateTrail() {
      for (let i=trailDots.length-1;i>0;i--) {
        trailDots[i].x+=(trailDots[i-1].x-trailDots[i].x)*0.3;
        trailDots[i].y+=(trailDots[i-1].y-trailDots[i].y)*0.3;
        trailDots[i].el.style.left=trailDots[i].x+'px';
        trailDots[i].el.style.top=trailDots[i].y+'px';
      }
      if(trailDots[0]) { trailDots[0].el.style.left=trailDots[0].x+'px'; trailDots[0].el.style.top=trailDots[0].y+'px'; }
      requestAnimationFrame(updateTrail);
    }
    updateTrail();
  }

  function animate() {
    rx+=(mx-rx)*0.12; ry+=(my-ry)*0.12;
    ring.style.left=rx+'px'; ring.style.top=ry+'px';
    requestAnimationFrame(animate);
  }
  animate();
}

  els.forEach(el=>io.observe(el));
}

      <div className="skill-bar-track">

        </h1>
        <p className="hero-tagline">Engineering · Developer · Designer Senior</p>
        <div className="hero-divider"></div>
        <p className="hero-desc">
          I make things for the web. Code, design, whatever it takes to ship something that actually works and looks good doing it.
        </p>

          <a href="#projects" className="btn-primary">View Work</a>
          <a href="#contact" className="btn-ghost">Get in Touch</a>
        </div>
        <div className="scroll-indicator">
          <span>Descend</span>

        </div>
      </section>

      {/* ABOUT */}
      <section id="about">
        <Drips color={accent} enabled={tweaks.dripsEnabled}/>
        <div className="section-inner about-grid">
          <div className="about-portrait reveal">
            <div className="about-portrait-decor"></div>
            <div className="about-portrait-decor2"></div>
            <div className="about-portrait-frame">

            <div className="section-label reveal">01 — Who I Am</div>
            <h2 className="section-title reveal reveal-delay-1">The Architect<br/>Behind the Code</h2>

            <p className="reveal reveal-delay-2">
              I'm <strong>x1yzl</strong> — I do frontend, backend, and design. Started coding because I wanted to build my own stuff, stayed because I genuinely love it. I care a lot about how things look AND how they work under the hood.
            </p>
            <p className="reveal reveal-delay-3">
              Most of my work is web apps — React, Node, the usual stack. I also do UI/UX when a project needs it, which is honestly most of the time. Still learning, always shipping.
            </p>
            <div className="about-stats reveal reveal-delay-4">
              <div className="stat-card">
                <span className="stat-number">3+</span>
                <span className="stat-label">Years Active</span>
              </div>
              <div className="stat-card">
                <span className="stat-number">15+</span>
                <span className="stat-label">Projects Shipped</span>
              </div>
              <div className="stat-card">
                <span className="stat-number">∞</span>
                <span className="stat-label">Iterations</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="skills">
        <div className="section-inner">
          <div className="section-label reveal">02 — Arsenal</div>
          <h2 className="section-title reveal reveal-delay-1">Skills &<br/>Tech Stack</h2>
          <div className="section-sep reveal reveal-delay-2"></div>
          <div className="skills-grid">
            {skills.map((cat,ci)=>(
              <div key={cat.cat} className={`skill-category reveal reveal-delay-${ci+1}`}>
                <div className="skill-cat-title">
                  <span>{cat.icon}</span> {cat.cat}
                </div>
                <ul className="skill-list">
                  {cat.items.map(s=>(
                    <SkillBar key={s.name} name={s.name} pct={s.pct}/>
                  ))}
                </ul>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* PROJECTS */}
      <section id="projects">
        <Drips color={accent} enabled={tweaks.dripsEnabled}/>
        <div className="section-inner">
          <div className="section-label reveal">03 — Work</div>
          <h2 className="section-title reveal reveal-delay-1">Projects &<br/>Deployments</h2>
          <div className="section-sep reveal reveal-delay-2"></div>
          <div className="projects-grid">
            <div className="project-card reveal reveal-delay-1">
              <div className="project-thumb">
                <div className="project-thumb-grid"></div>
                <div className="project-thumb-label">
                  <span className="project-icon">⌬</span>
                  Portfolio v1
                </div>
              </div>
              <div className="project-body">
                <div className="project-tag-row">
                  <span className="project-tag">HTML</span>
                  <span className="project-tag">CSS</span>
                </div>
                <div className="project-name">Portfolio v1</div>
                <p className="project-desc">My first real portfolio. Scrapped it eventually but learned a lot building it. The bones were solid, the design not so much.</p>
                <div className="project-links">
                  <a href="https://github.com/x1yzl/x1yzl.github.io" target="_blank" rel="noopener noreferrer" className="project-link">↗ View</a>
                </div>
              </div>
            </div>
          </div>
          <ShowMoreBtn/>
        </div>
      </section>

      {/* SERVICES */}
      <section id="services">
        <div className="section-inner">
          <div className="section-label reveal">04 — Offering</div>
          <h2 className="section-title reveal reveal-delay-1">Services</h2>
          <div className="section-sep reveal reveal-delay-2"></div>
          <div className="services-grid">
            {services.map((s,i)=>(
              <div key={s.num} className={`service-card reveal reveal-delay-${(i%4)+1}`}>
                <div className="service-num">{s.num}</div>
                <div className="service-name">{s.name}</div>
                <div className="service-desc">{s.desc}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* CONTACT */}
      <section id="contact">
        <div className="section-inner contact-inner">
          <div className="section-label reveal" style={{justifyContent:'center'}}>05 — Reach Out</div>
          <h2 className="section-title reveal reveal-delay-1" style={{textAlign:'center'}}>Begin a<br/>Collaboration</h2>
          <div className="section-sep reveal reveal-delay-2" style={{margin:'0 auto 2rem'}}></div>
          <p className="contact-subtitle reveal reveal-delay-3">
            Got something you want to build? Or just want to talk shop? Either way, hit me up. I'm open to freelance work, collabs, and interesting problems.
          </p>
          <div className="reveal reveal-delay-3" style={{display:'flex',justifyContent:'center'}}>
            <button
              className="btn-primary"
              onClick={() => setDcModalOpen(true)}
              style={{display:'inline-flex',alignItems:'center',gap:'0.6rem',border:'none'}}
            >
              <svg viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg" style={{width:16,height:16,fill:'currentColor',flexShrink:0}}>
                <path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15zM42.45 65.69C36.18 65.69 31 60 31 53s5-12.74 11.43-12.74S54 46 53.89 53s-5.05 12.69-11.44 12.69zm42.24 0C78.41 65.69 73.25 60 73.25 53s5-12.74 11.44-12.74S96.23 46 96.12 53s-5.04 12.69-11.43 12.69z"/>
              </svg>
              Send a Message
            </button>
          </div>
          {dcModalOpen && (
            <DiscordModal
              onAccept={() => setDcModalOpen(false)}
              onReject={() => setDcModalOpen(false)}
            />
          )}
          <div className="contact-links reveal reveal-delay-4">
            {[
              {label:'GitHub',href:'https://github.com/x1yzl'},
{label:'Email',href:'mailto:x1yzl@proton.me'},
            ].map(l=>(
              <a key={l.label} href={l.href} className="contact-link" target="_blank" rel="noopener noreferrer">
                ↗ {l.label}
              </a>
            ))}
          </div>

      {/* FOOTER */}
      <footer>
        <div className="footer-copy">© 2026 x1yzl — All Rights Reserved</div>
        <div className="footer-blood">Engineering · Developer · Designer Senior</div>
      </footer>

      {/* TWEAKS */}
      <TweaksPanel>
        <TweakSection title="Appearance">
          <TweakColor label="Accent Color" tweakKey="accentColor" />
        </TweakSection>
        <TweakSection title="Particles">
          <TweakSlider label="Particle Count" tweakKey="particleCount" min={10} max={150} step={5}/>
        </TweakSection>
        <TweakSection title="Effects">
          <TweakToggle label="Glitch Text" tweakKey="glitchEnabled"/>
          <TweakToggle label="Blood Drips" tweakKey="dripsEnabled"/>
          <TweakToggle label="Cursor Trail" tweakKey="cursorTrailEnabled"/>
          <TweakToggle label="Floating Runes" tweakKey="runesEnabled"/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

function waitForTweaks(cb, attempts = 0) {
  if (window.useTweaks) { cb(); return; }
  if (attempts > 50) { console.error('tweaks-panel never loaded'); cb(); return; }
  setTimeout(() => waitForTweaks(cb, attempts + 1), 50);
}

waitForTweaks(() => {
  ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
});
</script>

</body>
